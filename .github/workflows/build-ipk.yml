name: Build WatchYourLAN ipk

on:
  workflow_dispatch:
    inputs:
      wyl_tag:
        description: 'WatchYourLAN release tag (留空 = latest)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve WatchYourLAN version
        id: resolve
        run: |
          set -e
          TAG="${{ github.event.inputs.wyl_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -s https://api.github.com/repos/aceberg/WatchYourLAN/releases/latest | jq -r .tag_name)
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved WatchYourLAN ${TAG} (version ${VER})"

      - name: Download & extract arm64 binary
        run: |
          set -e
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET_URL=$(curl -s "https://api.github.com/repos/aceberg/WatchYourLAN/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name | test("linux_arm64.*\\.tar\\.gz$")) | .browser_download_url')
          if [ -z "$ASSET_URL" ]; then
            echo "::error::找不到 linux_arm64 的 .tar.gz 资产，去 release 页面确认真实文件名后手动调整这里的正则"
            exit 1
          fi
          echo "downloading: $ASSET_URL"
          curl -fL "$ASSET_URL" -o wyl.tar.gz

          mkdir -p pkg/watchyourlan/data/usr/bin
          tar -xzf wyl.tar.gz -C pkg/watchyourlan/data/usr/bin

          echo "----- extracted files -----"
          find pkg/watchyourlan/data/usr/bin -type f -print

          cd pkg/watchyourlan/data/usr/bin
          # 上游 tar.gz 解压后会套一层 watchyourlan_<ver>_linux_arm64/ 目录，
          # 二进制在里面，同目录还有 install.sh / watchyourlan.service / LICENSE，
          # 所以按精确文件名递归找，而不是只看当前层。
          if [ ! -f ./watchyourlan ]; then
            BIN=$(find . -type f -name "watchyourlan" | head -n1)
            if [ -z "$BIN" ]; then
              echo "::error::没找到名为 watchyourlan 的可执行文件，检查下面的 extracted files 列表"
              exit 1
            fi
            echo "found: $BIN"
            mv "$BIN" /tmp/watchyourlan-bin
            find . -mindepth 1 -delete
            mv /tmp/watchyourlan-bin ./watchyourlan
          fi
          chmod +x watchyourlan
          echo "----- final usr/bin content -----"
          ls -la .

      - name: Build watchyourlan.ipk
        run: bash scripts/build_ipk.sh watchyourlan "${{ steps.resolve.outputs.ver }}" aarch64_cortex-a53

      - name: Build luci-app-watchyourlan.ipk
        run: bash scripts/build_ipk.sh luci-app-watchyourlan "1.0" all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchyourlan-ipk-${{ steps.resolve.outputs.ver }}
          path: out/*.ipk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wyl-${{ steps.resolve.outputs.ver }}-${{ github.run_number }}
          name: WatchYourLAN ${{ steps.resolve.outputs.ver }} (aarch64_cortex-a53)
          files: out/*.ipk
